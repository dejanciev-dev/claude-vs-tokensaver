name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or problem, not just the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed change
  - type: dropdown
    id: tokens
    attributes:
      label: Effect on token usage
      options:
        - Saves tokens
        - Neutral
        - Costs more tokens, but worth it
        - Not sure
